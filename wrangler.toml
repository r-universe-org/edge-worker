name = "r-universe-edge"
main = "src/index.js"
compatibility_date = "2026-08-01"
account_id = "3fcdf4a2e34a7a2e74fc8686b68acea1" # rOpenSci Main, owner of the active r-universe.dev zone

# Run on all universe subdomains, and on r-universe.dev itself. A route (not a custom domain) is required: requests
# from the worker to the same zone (also /api/allowlist) then go to the origin instead of the worker again.
routes = [
  { pattern = "*.r-universe.dev/*", zone_name = "r-universe.dev" },
  { pattern = "r-universe.dev/*", zone_name = "r-universe.dev" }
]

# Hits per universe and package, see README.md. The dataset is created on the first write.
[[analytics_engine_datasets]]
binding = "HITS"
dataset = "r_universe_hits"

# For the stats on /cf/downloads and /cf/pageviews, which read the hits with the SQL API. The
# token (Account Analytics: Read) is a secret: npx wrangler secret put ANALYTICS_TOKEN
[vars]
ANALYTICS_ACCOUNT = "3fcdf4a2e34a7a2e74fc8686b68acea1"

# Every package deployment, see README.md. Created with the cf CLI token (wrangler's has no D1 access).
[[d1_databases]]
binding = "DEPLOYS"
database_name = "r-universe-deployments"
database_id = "b4ef5717-f330-4e76-bfa0-5e90793643fe"
migrations_dir = "migrations"
